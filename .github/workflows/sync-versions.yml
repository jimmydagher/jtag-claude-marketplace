# Keeps each plugin's "version" in marketplace.json equal to its released
# plugin.json by committing the change straight to the default branch.
# Claude Code only offers an update when that version changes.
# See scripts/sync_versions.py.
name: Sync plugin versions

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:      # run now: gh workflow run sync-versions.yml -R jimmydagher/jtag-claude-marketplace
  repository_dispatch:    # a plugin repo can trigger it after a release
    types: [plugin-released]

permissions:
  contents: write

concurrency:
  group: sync-versions
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read published plugin versions
        id: sync
        run: |
          set +e
          summary=$(python scripts/sync_versions.py)
          code=$?
          set -e
          echo "$summary"
          if [ "$code" -eq 10 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            { echo "summary<<EOF"; echo "$summary"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Commit the new versions to the default branch
        if: steps.sync.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.sync.outputs.summary }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json
          git commit -m "chore: sync plugin versions" -m "$SUMMARY"
          # main may have moved since checkout; rebase onto it and retry.
          for attempt in 1 2 3; do
            git push origin "HEAD:$BRANCH" && exit 0
            git pull --rebase origin "$BRANCH"
          done
          exit 1
