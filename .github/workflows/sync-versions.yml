# Keeps each plugin's "version" in marketplace.json equal to its released
# plugin.json, through a PR that is merged automatically. Claude Code only
# offers an update when that version changes. See scripts/sync_versions.py.
name: Sync plugin versions

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:      # run now: gh workflow run sync-versions.yml -R jimmydagher/jtag-claude-marketplace
  repository_dispatch:    # a plugin repo can trigger it after a release
    types: [plugin-released]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-versions
  cancel-in-progress: false

env:
  BRANCH: sync/plugin-versions

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read published plugin versions
        id: sync
        run: |
          set +e
          summary=$(python scripts/sync_versions.py)
          code=$?
          set -e
          echo "$summary"
          if [ "$code" -eq 10 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            { echo "summary<<EOF"; echo "$summary"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Open and merge the version PR
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.sync.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add .claude-plugin/marketplace.json
          git commit -m "chore: sync plugin versions" -m "$SUMMARY"
          git push --force origin "$BRANCH"
          title="chore: sync plugin versions — $(echo "$SUMMARY" | paste -sd ';' - | sed 's/;/; /g')"
          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -qx OPEN; then
            gh pr edit "$BRANCH" --title "$title" --body "$SUMMARY"
          else
            gh pr create --head "$BRANCH" --base "${{ github.event.repository.default_branch }}" --title "$title" --body "$SUMMARY"
          fi
          gh pr merge "$BRANCH" --squash --delete-branch
